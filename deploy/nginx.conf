# The outer HTTPS reverse proxy forwards the original scheme. This gateway is
# exposed only on loopback in the production compose file.
map $http_x_forwarded_proto $vita_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;

    # Profile attachments allow 25 MB of file data plus multipart headers.
    client_max_body_size 30m;

    location /api/auth/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $vita_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $vita_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $vita_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
