[project]
name = "lt-employ-assistant-api"
version = "0.1.0"
description = "FastAPI backend for LT Employ Assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "langchain>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "openpyxl>=3.1,<4.0",
  "python-docx>=1.2,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "pypdf>=6.0,<7.0",
  "reportlab>=4.4,<5.0",
  "pydantic-settings>=2.10,<3.0",
  "sqlalchemy[asyncio]>=2.0.43,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
  "websockets>=15,<17",
  "xlrd>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "langchain-openai>=1.0,<2.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<10.0",
  "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
